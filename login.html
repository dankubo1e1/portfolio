<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Works Access | Dan Kubo</title>
    <!-- ファビコン設定 -->
    <link rel="icon" type="image/jpeg" href="img/main-artist.jpg">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts & Helvetica対応 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
        .artist-title-font {
            font-family: "Helvetica Neue", Helvetica, Arial, 'Inter', 'Noto Sans JP', sans-serif;
            font-weight: 700;
        }
        .bg-overlay {
            background: linear-gradient(
                to bottom,
                #0a0a0a 0%,
                rgba(10, 10, 10, 0.75) 20%,
                rgba(10, 10, 10, 0.75) 80%,
                #0a0a0a 100%
            );
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
    </style>
</head>
<body class="dark bg-[#0a0a0a] text-neutral-200 min-h-screen flex flex-col justify-between selection:bg-neutral-800 selection:text-white relative overflow-x-hidden">

    <!-- 背景：固定画像 ＋ グラデーションブラーフィルター -->
    <div 
        class="fixed inset-0 bg-cover bg-center z-0 scale-105 transform pointer-events-none" 
        style="background-image: url('img/bg-artist.jpg');"
    ></div>
    <div class="fixed inset-0 bg-overlay z-0 pointer-events-none"></div>

    <!-- コンテンツ全体 -->
    <div class="relative z-10 flex flex-col min-h-screen justify-between">

        <!-- ヘッダー -->
        <header class="w-full max-w-5xl mx-auto px-6 py-8 flex justify-between items-center">
            <a href="index.html" class="text-2xl tracking-tight text-white artist-title-font">
                Dan Kubo <span class="text-neutral-600 font-light">/</span> <span class="text-neutral-400 font-light text-sm">Client Works</span>
            </a>
            <a href="index.html" class="text-xs text-neutral-400 hover:text-white transition flex items-center space-x-1">
                <i class="fa-solid fa-arrow-left text-[10px]"></i>
                <span>Back to Home</span>
            </a>
        </header>

        <!-- メイン：中央配置のパスワード入力フォーム -->
        <main class="w-full max-w-md mx-auto px-6 py-12 flex-grow flex flex-col justify-center items-center">
            <div class="w-full bg-neutral-950/60 border border-neutral-800/80 backdrop-blur-xl p-8 rounded-2xl shadow-2xl space-y-6 text-center">
                
                <div class="space-y-2">
                    <h1 class="text-lg font-normal text-white tracking-tight">Protected Content</h1>
                </div>

                <form id="cw-login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <input 
                            type="password" 
                            id="cw-password" 
                            placeholder="Enter Passcode" 
                            required
                            class="w-full bg-neutral-900/80 border border-neutral-800 text-sm text-neutral-200 px-4 py-3 rounded-xl focus:outline-none focus:border-neutral-600 transition text-center tracking-widest placeholder:tracking-normal placeholder:text-neutral-600"
                        >
                    </div>
                    <button 
                        type="submit" 
                        class="w-full bg-white text-black hover:bg-neutral-200 text-xs uppercase tracking-widest font-semibold py-3 rounded-xl transition shadow-lg"
                    >
                        Access Portfolio
                    </button>
                </form>
                <p id="error-msg" class="text-xs text-red-400 hidden font-light">Passcode is incorrect. Please try again.</p>

            </div>
        </main>

        <!-- フッター -->
        <footer class="w-full border-t border-white/5 py-6 px-6 backdrop-blur-md bg-[#0a0a0a]/50 text-center">
            <div class="text-xs text-neutral-600">
                &copy; Dan Kubo. All rights reserved.
            </div>
        </footer>

    </div>

    <!-- JavaScript -->
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const inputPass = document.getElementById('cw-password').value;
            const errorMsg = document.getElementById('error-msg');
            const targetPass = "dkcw2026"; 

            if (inputPass === targetPass) {
                sessionStorage.setItem('cw_auth', 'true');
                window.location.href = 'portfolio.html';
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('cw-password').value = '';
            }
        }
    </script>
</body>
</html>
